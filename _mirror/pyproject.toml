[project]
name = "kerio-updates-mirror"
version = "3.6.2"
requires-python = ">=3.15.2"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "granian>=2.8.7",
    "httpx[socks]>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "beautifulsoup4>=4.15.0",
    "pytest-playwright>=0.10.0",
    "uvicorn>=0.54.0",
]
