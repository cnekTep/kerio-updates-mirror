[project]
name = "kerio-updates-mirror"
version = "3.6.1"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "cryptography>=50.0.2",
    "fastapi>=0.143.1",
    "granian>=2.8.4",
    "httpx[socks]>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.3",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
