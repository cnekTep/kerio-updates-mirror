<article>
    <form id="article"
          hx-post="{{ request.url.path }}"
          hx-target="#article"
          hx-swap="none">

        <article>
            <header>Email</header>
            <label class="mb-0">
                <input id="email_enabled" name="email_enabled" type="checkbox"
                       data-controls="email_settings_block"
                       {% if email_enabled %} checked {% endif %}>
                Enable email notifications
            </label>

            <div id="email_settings_block" class="mb-0"
                 data-controlled-by="email_settings_block" data-effect="hidden"
                 {% if not email_enabled %} data-hidden {% endif %}>
                <div class="settings-grid size-5-fr mt-1r"
                     data-controlled-by="email_settings" data-effect="aria-disabled"
                     aria-disabled="{% if email_enabled %} false {% else %} true {% endif %}">
                    <p class="pb-1r">Email to:</p>
                    <input type="text" name="email_to" id="email_to"
                           placeholder="user1@example.com, user2@example.com"
                           aria-label="Email to"
                           value="{{ email_to or '' }}">
                </div>

                <div class="form-group settings-grid size-5-fr">
                    <label for="email_template" class="pb-1r">Template:</label>
                    <select id="email_template" name="email_template" class="form-control">
                        {% for template in list_email_templates or [] %}
                        {% set template_clean = template.strip() %}
                        {# Split "default.html" into name and extension for display #}
		                {% set name, ext = template_clean.rsplit('.', 1) %}
                        <option value="{{ template_clean }}"
                                {% if email_template == template_clean %} selected {% endif %}>
                            {{ name | replace('_', ' ') | title }} {{ ext | upper }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <details name="email_settings" class="mb-0">
                    <summary class="mb-05r">SMTP settings</summary>
                    <hr>
                    <div class="grid">
                        <label for="smtp_host">
                            SMTP host:
                            <input type="text" name="smtp_host" id="smtp_host" placeholder="smtp.example.com"
                                   value="{{ smtp_host or '' }}">
                        </label>
                        <label for="smtp_port">
                            SMTP port:
                            <input type="number" name="smtp_port" id="smtp_port" min="1" max="65535" placeholder="587"
                                   value="{{ smtp_port or '' }}">
                        </label>
                    </div>

                    <div class="grid">
                        <label for="smtp_username">
                            Username:
                            <input type="text" name="smtp_username" id="smtp_username" placeholder="Enter SMTP username"
                                   autocomplete="off" value="{{ smtp_username or '' }}">
                        </label>
                        <label for="smtp_password">
                            Password:
                            <input type="password" name="smtp_password" id="smtp_password"
                                   placeholder="Enter SMTP password"
                                   autocomplete="new-password" value="{{ smtp_password or '' }}">
                        </label>
                    </div>

                    <div class="grid">
                        <label for="smtp_from">
                            From address:
                            <input type="text" name="smtp_from" id="smtp_from"
                                   placeholder="noreply@example.com"
                                   value="{{ smtp_from or '' }}">
                        </label>
                        <label for="smtp_from_name">
                            From name:
                            <input type="text" name="smtp_from_name" id="smtp_from_name"
                                   placeholder="Kerio Updates Mirror"
                                   value="{{ smtp_from_name or '' }}">
                        </label>
                    </div>

                    <div class="grid">
                        <label for="smtp_timeout">
                            Connection timeout (s):
                            <input type="number" name="smtp_timeout" id="smtp_timeout" min="1" placeholder="10"
                                   value="{{ smtp_timeout or '' }}">
                        </label>
                    </div>

                    <label class="mb-1r">
                        <input id="smtp_use_tls" name="smtp_use_tls" type="checkbox"
                               {% if smtp_use_tls %} checked {% endif %}>
                        Use STARTTLS
                    </label>

                    <button type="button" id="test-email-btn" class="secondary mb-0 w-100"
                            hx-post="{{ url_for('send_test_email') }}">
                        Check
                    </button>
                </details>
            </div>
        </article>

        <article>
            <header>Telegram</header>
            <label class="mb-0">
                <input id="telegram_enabled" name="telegram_enabled" type="checkbox"
                       data-controls="telegram_settings_block"
                       {% if telegram_enabled %} checked {% endif %}>
                Enable Telegram notifications
            </label>

            <div id="telegram_settings_block" class="mb-0"
                 data-controlled-by="telegram_settings_block" data-effect="hidden"
                 {% if not telegram_enabled %} data-hidden {% endif %}>
                <div class="form-group settings-grid size-5-fr mt-1r">
                    <label for="telegram_template" class="pb-1r">Template:</label>
                    <select id="telegram_template" name="telegram_template" class="form-control">
                        {% for template in list_telegram_templates or [] %}
                        {% set template_clean = template.strip() %}
                        {# Split "default.txt" into name and extension for display #}
                        {% set name, ext = template_clean.rsplit('.', 1) %}
                        <option value="{{ template_clean }}"
                                {% if telegram_template== template_clean %} selected {% endif %}>
                            {{ name | replace('_', ' ') | title }} {{ ext | upper }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <details name="telegram_settings" class="mb-0">
                    <summary class="mb-05r">Telegram settings</summary>
                    <hr>
                    <div class="settings-grid size-5-fr mt-1r"
                         data-controlled-by="telegram_settings" data-effect="aria-disabled"
                         aria-disabled="{% if telegram_enabled %} false {% else %} true {% endif %}">
                        <p class="pb-1r">Bot token:</p>
                        <input type="text" name="bot_token" id="bot_token" class="mb-0"
                               placeholder="123456789:AAExampleTokenFromBotFather"
                               aria-label="Bot token"
                               value="{{ bot_token or '' }}">
                    </div>

                    <div class="settings-grid size-5-fr mt-1r"
                         data-controlled-by="telegram_settings" data-effect="aria-disabled"
                         aria-disabled="{% if telegram_enabled %} false {% else %} true {% endif %}">
                        <p class="pb-1r">Chat ID:</p>
                        <input type="text" name="chat_id" id="chat_id" class="mb-0"
                               placeholder="-1001234567890 or @chat_name"
                               aria-label="Chat ID"
                               value="{{ chat_id or '' }}">
                    </div>

                    <div class="settings-grid size-5-fr mt-1r"
                         data-controlled-by="telegram_settings" data-effect="aria-disabled"
                         aria-disabled="{% if telegram_enabled %} false {% else %} true {% endif %}">
                        <p class="pb-1r">API URL:</p>
                        <input type="text" name="bot_api_url" id="bot_api_url"
                               placeholder="api.telegram.org"
                               aria-label="Bot API URL"
                               value="{{ bot_api_url or '' }}">
                    </div>

                    <label>
                        <input id="telegram_threads_enabled" name="telegram_threads_enabled" type="checkbox"
                               data-controls="telegram_threads_block"
                               {% if thread_enabled %} checked {% endif %}>
                        Enable Telegram threads
                    </label>

                    <div id="telegram_threads_block" class="mb-0 mt-1r"
                         data-controlled-by="telegram_threads_block" data-effect="hidden"
                         {% if not thread_enabled %} data-hidden {% endif %}>
                        <div class="settings-grid size-4_5-fr-9 gap-0_5">
                            <p class="pb-1r">Updates:</p>
                            <input type="number" name="thread_updates_id" id="thread_updates_id"
                                   placeholder="Enter updates thread ID"
                                   aria-label="Updates thread ID"
                                   value="{{ thread_updates_id or '' }}">
                            <input type="button" value="Check" class = "secondary"
                                   id="test-telegram-updates-btn"
                                   hx-post="{{ url_for('send_test_telegram') }}"
                                   hx-vals='{"target": "updates"}'
                            />
                        </div>
                        <div class="settings-grid size-4_5-fr-9 gap-0_5">
                            <p class="pb-1r">Errors:</p>
                            <input type="number" name="thread_errors_id"
                                   id="thread_errors_id" class="mb-0"
                                   placeholder="Enter errors thread ID"
                                   aria-label="Errors thread ID"
                                   value="{{ thread_errors_id or '' }}">
                            <input type="button" value="Check" class="secondary mb-0"
                                   id="test-telegram-errors-btn"
                                   hx-post="{{ url_for('send_test_telegram') }}"
                                   hx-vals='{"target": "errors"}'
                            />
                        </div>
                    </div>

                    <button type="button" id="test-telegram-btn" class="secondary mb-0 w-100"
                            data-controlled-by="telegram_threads_block" data-effect="hidden-on-check"
                            {% if thread_enabled %} hidden {% endif %}
                            hx-post="{{ url_for('send_test_telegram') }}">
                    Check
                    </button>
                </details>
            </div>
        </article>

        <dialog id="save-dialog">
            <article>
                <h3 id="save-dialog-message"></h3>
            </article>
        </dialog>

        <button class="mb-0" type="submit">Save settings</button>
    </form>
</article>
