user  nginx;
worker_processes  auto;

# log errors to stderr (visible in docker logs)
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_names_hash_bucket_size 64;
    client_max_body_size 1024M;

    # structured log format for docker logs
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    # skip logging empty requests
    map $request $loggable {
        default  1;
        ""       0;
    }
    access_log /dev/stdout main if=$loggable;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # use HTTP/1.1 keepalive to backend
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    # timeouts
    proxy_connect_timeout  5s;
    proxy_send_timeout     50s;
    proxy_read_timeout     50s;

    # -------------------------------------------------------------------------
    # HTTP - port 80
    # -------------------------------------------------------------------------
    server {
        listen 80;

        # kerio hosts
        server_name kerio-updates-mirror.local bda-update.kerio.com bdupdate.kerio.com download.kerio.com ids-update.kerio.com prod-update.kerio.com shieldmatrix-updates.gfikeriocontrol.com wf-activation.kerio.com;

        # /web - restricted to allowed_ips_web.conf
        location /web/ {
            include /etc/nginx/watch/allowed_ips_web.conf;
            deny all;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_pass http://172.200.0.10:8000;
        }

        # / - restricted to allowed_ips_api.conf
        location / {
            allow 172.200.0.5;
            include /etc/nginx/watch/allowed_ips_api.conf;
            deny all;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_pass http://172.200.0.10:8000;
        }
    }

    server {
        listen 80 default_server;

        # all other hosts
        server_name _;

        # /api, /v2 and /registration - restricted to allowed_ips_api.conf
        location ~ ^/(api|v2|registration)/ {
            include /etc/nginx/watch/allowed_ips_api.conf;
            deny all;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_pass http://172.200.0.10:8000;
        }

        # /web - restricted to allowed_ips_web.conf
        location /web/ {
            include /etc/nginx/watch/allowed_ips_web.conf;
            deny all;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_pass http://172.200.0.10:8000;
        }

        # block everything else
        location / {
            return 444;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS - port 443
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;

        include /etc/nginx/ssl_params.conf;

        # kerio hosts
        server_name kerio-updates-mirror.local bda-update.kerio.com bdupdate.kerio.com download.kerio.com ids-update.kerio.com prod-update.kerio.com shieldmatrix-updates.gfikeriocontrol.com wf-activation.kerio.com;

        # /web - restricted to allowed_ips_web.conf
        location /web/ {
            include /etc/nginx/watch/allowed_ips_web.conf;
            deny all;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_pass http://172.200.0.10:8000;
        }

        # / - restricted to allowed_ips_api.conf
        location / {
            allow 172.200.0.5;
            include /etc/nginx/watch/allowed_ips_api.conf;
            deny all;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_pass http://172.200.0.10:8000;
        }
    }

    server {
        listen 443 ssl default_server;

        include /etc/nginx/ssl_params.conf;

        # all other hosts
        server_name _;

        # /api, /v2 and /registration - restricted to allowed_ips_api.conf
        location ~ ^/(api|v2|registration)/ {
            include /etc/nginx/watch/allowed_ips_api.conf;
            deny all;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_pass http://172.200.0.10:8000;
        }

        # /web - restricted to allowed_ips_web.conf
        location /web/ {
            include /etc/nginx/watch/allowed_ips_web.conf;
            deny all;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_pass http://172.200.0.10:8000;
        }

        # block everything else
        location / {
            return 444;
        }
    }
}

# =============================================================================
# TCP passthrough - port 8118 (tinyproxy, CONNECT method)
# Layer 4 proxy: nginx does not inspect HTTP, CONNECT tunnels pass through as-is
# =============================================================================
stream {
    log_format stream '$remote_addr [$time_local] $protocol '
                      '$status $bytes_sent $bytes_received '
                      '$session_time';
    access_log /dev/stdout stream;

    server {
        listen 8118;

        # stream operates at TCP level - restricted to allowed_ips_api.conf
        include /etc/nginx/watch/allowed_ips_api.conf;
        deny all;

        proxy_pass            172.200.0.5:8118;
        proxy_connect_timeout 5s;
        proxy_timeout         10m;
    }
}