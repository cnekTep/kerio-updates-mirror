user  nginx;
worker_processes  auto;

# log errors to stderr (visible in docker logs)
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_names_hash_bucket_size 64;
    client_max_body_size 1024M;

    # structured log format for docker logs
    log_format main '$remote_addr - [$time_local] "$request" host="$host" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent"';

    # skip logging empty requests
    map $request $loggable {
        default  1;
        ""       0;
    }
    access_log /dev/stdout main if=$loggable;

    # Efficient file transfer - required for good static serving
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # Compression for text-based static assets
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # use HTTP/1.1 keepalive to backend
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    # headers
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # timeouts
    proxy_connect_timeout  5s;
    proxy_send_timeout     50s;
    proxy_read_timeout     50s;

    upstream mirror {
        server 172.200.0.10:8000;
    }

    # -------------------------------------------------------------------------
    # HTTP - port 80
    # -------------------------------------------------------------------------
    server {
        listen 80 default_server;

        # /web and /docs - restricted to allowed_ips_web.conf
        location ~ ^/(web|docs)(/|$) {
            include /etc/nginx/watch/allowed_ips_web.conf;
            deny all;

            # redirect to https
            return 301 https://$host$request_uri;
        }

        # Internal-only location - not reachable directly by clients,
        # only via X-Accel-Redirect issued from FastAPI after auth check
        location /internal-update-files/ {
            internal;
            alias /etc/nginx/update_files/;
        }

        # / - restricted to allowed_ips_api.conf
        location / {
            allow 172.200.0.5;
            include /etc/nginx/watch/allowed_ips_api.conf;
            deny all;

            proxy_pass http://mirror;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS - port 443
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl default_server;
        http2 on;

        include /etc/nginx/ssl_params.conf;

        # Static files served directly by nginx, bypassing FastAPI entirely,
        # but still gated by the same IP allowlist as /web
        location ^~ /web/static/ {
            include /etc/nginx/watch/allowed_ips_web.conf;
            deny all;

            alias /etc/nginx/static/;

            etag on;
            add_header Cache-Control "public, must-revalidate";

            limit_except GET HEAD {
                deny all;
            }

            autoindex off;
            access_log off;
        }

        # /web and /docs - restricted to allowed_ips_web.conf
        location ~ ^/(web|docs)(/|$) {
            include /etc/nginx/watch/allowed_ips_web.conf;
            deny all;

            proxy_pass http://mirror;
        }

        # Internal-only location - not reachable directly by clients,
        # only via X-Accel-Redirect issued from FastAPI after auth check
        location /internal-update-files/ {
            internal;
            alias /etc/nginx/update_files/;
        }

        # / - restricted to allowed_ips_api.conf
        location / {
            allow 172.200.0.5;
            include /etc/nginx/watch/allowed_ips_api.conf;
            deny all;

            proxy_pass http://mirror;
        }
    }
}

# =============================================================================
# TCP passthrough - port 8118 (tinyproxy, CONNECT method)
# Layer 4 proxy: nginx does not inspect HTTP, CONNECT tunnels pass through as-is
# =============================================================================
stream {
    log_format stream '$remote_addr [$time_local] $protocol $status '
                      '$bytes_sent $bytes_received $session_time';
    access_log /dev/stdout stream;

    server {
        listen 8118;

        # stream operates at TCP level - restricted to allowed_ips_api.conf
        include /etc/nginx/watch/allowed_ips_api.conf;
        deny all;

        proxy_pass            172.200.0.5:8118;
        proxy_connect_timeout 5s;
        proxy_timeout         10m;
    }
}