services:

  xray:
    image: "kum_xray:v26.3.27"
    build:
      context: ./_xray
    stop_signal: SIGINT
    restart: unless-stopped
    #ports:
    #  - "1080:8118"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./_xray/confs:/usr/local/etc/xray
      - ./_xray/geodata:/usr/local/share/xray
      - ./_xray/logs:/var/log/xray
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 16M
    networks:
      mirror_net:
        ipv4_address: 172.200.0.5
    extra_hosts:
      - "kerio-updates-mirror.local:172.200.0.20"
      - "bda-update.kerio.com:172.200.0.20"
      - "bdupdate.kerio.com:172.200.0.20"
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  mirror:
    environment:
      APP_CONFIG__HAS_XRAY: "true"